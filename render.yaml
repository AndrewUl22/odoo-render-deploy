databases:
  - name: odoo-db
    databaseName: odoo
    user: odoo
    plan: free

services:
  - type: web
    name: odoo-portfolio
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: odoo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: odoo-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: odoo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: odoo-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: odoo-db
          property: database
      # Random password for the Odoo "admin" user, generated once by Render.
      # Read it in the dashboard: service -> Environment.
      - key: ADMIN_PASSWORD
        generateValue: true
    # Note: free web services can't attach a persistent disk, so Odoo's
    # filestore (uploaded attachments/images) resets on every redeploy.
    # Fine for a demo; move to a paid plan + disk later if that matters.
